name: OCR Lab — ML Kit
on:
  push:
    branches: [teste-validade-ocr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Prepare Android SDK and fixtures
        run: |
          command -v sdkmanager
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          if [ -f validade-fotos.zip ]; then
            mkdir -p ocr-lab/app/src/androidTest/assets
            for n in 01 02 03 04 05 06 07 08; do
              unzip -p validade-fotos.zip "$n.jpg" > "ocr-lab/app/src/androidTest/assets/$n.jpg"
              test -s "ocr-lab/app/src/androidTest/assets/$n.jpg"
            done
          else
            echo "::notice::Real photos not present; running synthetic image suite only."
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Date parser unit tests
        run: gradle -p ocr-lab :app:testDebugUnitTest --no-daemon
      - name: ML Kit on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: adb logcat -c && gradle -p ocr-lab :app:connectedDebugAndroidTest --no-daemon; result=$?; adb logcat -d -s OCRLab:I > ocr-lab/ocr-log.txt; exit $result
      - name: Upload test reports (not APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OCR-Lab-report
          path: |
            ocr-lab/app/build/reports/tests/
            ocr-lab/app/build/reports/androidTests/
            ocr-lab/app/build/outputs/androidTest-results/
            ocr-lab/ocr-log.txt
          if-no-files-found: warn
