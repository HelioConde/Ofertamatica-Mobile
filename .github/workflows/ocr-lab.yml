name: OCR Lab — ML Kit
on:
  push:
    branches: [teste-validade-ocr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android SDK and fixtures
        run: |
          command -v sdkmanager
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          if [ -f validade-fotos.zip ]; then
            mkdir -p ocr-lab/app/src/androidTest/assets
            for n in 01 02 03 04 05 06 07 08; do
              unzip -p validade-fotos.zip "$n.jpg" > "ocr-lab/app/src/androidTest/assets/$n.jpg"
              test -s "ocr-lab/app/src/androidTest/assets/$n.jpg"
            done
          else
            echo "::notice::Real photos not present; running synthetic image suite only."
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Date parser unit tests
        run: gradle -p ocr-lab :app:testDebugUnitTest --no-daemon
      - name: ML Kit on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            result=0; gradle -p ocr-lab :app:connectedDebugAndroidTest --no-daemon || result=$?; adb logcat -d -s OCRLab:I > ocr-lab/ocr-log.txt; mkdir -p ocr-lab/benchmark-images; for n in synthetic-1 synthetic-2 synthetic-3 synthetic-4 synthetic-5 synthetic-6 synthetic-7 synthetic-8 negative-1 negative-2 negative-3 negative-4; do adb exec-out run-as br.primor.ocrlab cat "files/ocr-benchmark/$n.png" > "ocr-lab/benchmark-images/$n.png" || result=1; done; exit "$result"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare alternate OCR engine on the same synthetic images
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -m pip install -r ocr-lab/tools/requirements.txt
          python ocr-lab/tools/compare.py
      - name: Upload test reports (not APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OCR-Lab-report
          path: |
            ocr-lab/app/build/reports/tests/
            ocr-lab/app/build/reports/androidTests/
            ocr-lab/app/build/outputs/androidTest-results/
            ocr-lab/ocr-log.txt
            ocr-lab/comparison.json
            ocr-lab/benchmark-images/
          if-no-files-found: warn
      - name: Publish OCR summary in job log
        if: always()
        run: |
          if [ -f ocr-lab/ocr-log.txt ]; then
            grep "OCRLab" ocr-lab/ocr-log.txt || true
            { echo "## OCR benchmark"; echo '```text'; grep -E "FINAL|total=|REAL PHOTOS NOT RUN" ocr-lab/ocr-log.txt || true; echo '```' ; } >> "$GITHUB_STEP_SUMMARY"
          fi
